name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # Convenção da org: o lint mora no repositório .github.
    uses: open-eda-labs/.github/.github/workflows/lint.yml@main

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # Pendência: pinar por SHA de commit (D-40).
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: open-eda-labs/demo-parent
          path: demo-parent
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # O PR não depende de ler o GitHub Packages: o parent da main vai para o ~/.m2 do runner.
      - run: mvn -B -ntp -q install
        working-directory: demo-parent
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn -B -ntp verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
